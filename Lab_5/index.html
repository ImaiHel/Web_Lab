<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Meet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;900&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <section id="title">
        <div class="container-fluid">

            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Dog Meet</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="#">О нас</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Собаки</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Контакты</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div class="row">
                <div class="col-lg-6">
                    <h1>Meet new and interesting dogs nearby</h1>
                    <button class="btn btn-dark btn-lg download-button">
                        <i class="fab fa-apple"></i> Download
                    </button>
                    <button class="btn btn-outline-light btn-lg download-button">
                        <i class="fab fa-google-play"></i> Download
                    </button>
                </div>
                <div class="col-lg-6">
                    <img class="title-image" src="images/iphone.png" alt="iPhone">
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
